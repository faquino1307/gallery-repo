<!doctype html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hello Bootstrap</title>
    <link rel="stylesheet" href="./css/styles.css" />
</head>

<body class="d-flex justify-content-center align-items-center bg-light">
    <div id="app">
        <!--App content-->
        <div class="container ">

            <!-- Título -->
            <h1 class="mb-4 text-center text-primary">Galería de Pinturas</h1>

            <!-- Filtro -->
            <div class="row mb-4">
                <div class="col-md-6 mx-auto">
                    <input type="text" id="searchInput" class="form-control" placeholder="Buscar por nombre o autor...">
                </div>
            </div>

            <ul class="nav nav-tabs" id="myTab" role="tablist">
                <li class="nav-item" role="presentation">
                    <button class="nav-link active" id="home-tab" data-bs-toggle="tab" data-bs-target="#home-tab-pane"
                        type="button" role="tab" aria-controls="home-tab-pane" aria-selected="true">
                        Galería
                    </button>
                </li>
                <li class="nav-item" role="presentation">
                    <button class="nav-link" id="profile-tab" data-bs-toggle="tab" data-bs-target="#profile-tab-pane"
                        type="button" role="tab" aria-controls="profile-tab-pane" aria-selected="false">Lista</button>
                </li>
                <li class="nav-item" role="presentation">
                    <button class="nav-link" id="contact-tab" data-bs-toggle="tab" data-bs-target="#contact-tab-pane"
                        type="button" role="tab" aria-controls="contact-tab-pane"
                        aria-selected="false">Coverflow</button>
                </li>
            </ul>
            <div class="tab-content" id="myTabContent">
                <div class="tab-pane fade show active" id="home-tab-pane" role="tabpanel" aria-labelledby="home-tab"
                    tabindex="0">
                    <div id="gallery" class="row g-4 main-gallery mt-3">
                        <!-- Aquí se insertarán las cards dinámicamente col-3 -->
                        <div class="row">
                        </div>
                    </div>
                </div>
                <div class="tab-pane fade" id="profile-tab-pane" role="tabpanel" aria-labelledby="profile-tab"
                    tabindex="0">
                    <div id="gallery-list" class="row g-4 main-gallery mt-3">
                        <!-- Aquí se insertarán las cards dinámicamente col-3 -->
                        <div class="row">
                            <ul id="gallery-list-ul" class="list-group">

                            </ul>
                        </div>
                    </div>
                </div>
                <div class="tab-pane fade" id="contact-tab-pane" role="tabpanel" aria-labelledby="contact-tab"
                    tabindex="0">
                    <div id="gallery-coverflow" class="row g-4 main-gallery mt-3">
                        <!-- Aquí se insertarán las cards dinámicamente col-3 -->
                        <div class="row">
                            <div id="coverflow" class="d-flex justify-content-center align-items-center mt-5">
                                <div class="coverflow-item active">
                                    <img src="mona.jpg" class="img-fluid rounded shadow">
                                    <h6 class="mt-2 text-center">Mona Lisa<br><small>Leonardo da Vinci</small></h6>
                                </div>
                                
                            </div>
                        </div>
                    </div>
                </div>

            </div>

            <!-- Galería -->


            <!-- Paginación -->
            <nav>
                <ul id="pagination" class="pagination justify-content-center mt-4"></ul>
            </nav>
            <div class="modal fade" id="gallery-modal" tabindex="-1" aria-hidden="true">
                <div class="modal-dialog modal-lg">
                    <div class="modal-content">
                        <div class="modal-header">
                            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                        </div>
                        <div class="modal-body">
                            modal 1
                        </div>
                    </div>
                </div>
            </div>
            <div class="modal fade" id="gallery-modal-2" tabindex="-1" aria-hidden="true">
                <div class="modal-dialog modal-lg">
                    <div class="modal-content">
                        <div class="modal-header">
                            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                        </div>
                        <div class="modal-body">
                            modal 2
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Importa tu JS con Vite -->
    <script type="module" src="./js/app.js"></script>
</body>

</html>
